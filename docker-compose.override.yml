services:
  app:
    build:
      context: .
      target: dev
    image: salon-backend:dev
    command: npx nodemon src/server.js
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    build:
      context: .
      target: dev
    image: salon-backend:dev
    command: npx nodemon src/jobs/worker.js
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
