services:
  app:
    build:
      context: .
      target: runtime
    image: salon-backend:local
    container_name: makeup-studio-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: node src/server.js
    stop_grace_period: 30s

  worker:
    build:
      context: .
      target: runtime
    image: salon-backend:local
    container_name: makeup-studio-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      TZ: Asia/Kathmandu
      BUSINESS_TZ: Asia/Kathmandu
      SERVICE_NAME: worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: node src/jobs/worker.js
    stop_grace_period: 30s

  db:
    image: postgres:16-alpine
    container_name: makeup-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: makeup-studio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  migrate:
    build:
      context: .
      target: runtime
    image: salon-backend:local
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SERVICE_NAME: migrate
    command: npm run db:migrate
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: salon_test
    tmpfs:
      - /var/lib/postgresql/data # in memory: fast, wiped on stop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d salon_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    profiles: ["test"]

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    profiles: ["test"]

  test:
    build:
      context: .
      target: dev
    image: salon-backend:dev
    command: npm test
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: test
      SERVICE_NAME: test
      LOG_LEVEL: silent
      TZ: Asia/Kathmandu
      BUSINESS_TZ: Asia/Kathmandu
      DATABASE_URL: postgresql://test:test@db-test:5432/salon_test
      REDIS_URL: redis://redis-test:6379
      JWT_SECRET: test-jwt-secret
      ADMIN_SESSION_SECRET: test-session-secret-not-for-real-use
      FRONTEND_ORIGIN: http://localhost
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      EMAIL_MODE: log
      SMS_MODE: log
      # + a dummy value for every other var in src/config.js `required`
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_started
    profiles: ["test"]

volumes:
  pgdata:
  redisdata:
