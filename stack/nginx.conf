# Local stand-in for the ALB.
#   /api/*, /backoffice*  -> backend replicas
#   everything else       -> frontend

# Re-resolve service names so stopped/started replicas leave and rejoin rotation.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $req_id;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # Debug only: shows which replica served the request.
    add_header X-Upstream $upstream_addr always;

    set $backend  backend:3000;
    set $frontend frontend:3001;

    location /api/ {
        proxy_pass http://$backend;
    }

    location /backoffice {
        proxy_pass http://$backend;
    }

    location / {
        proxy_pass http://$frontend;
    }
}
